name: Chess Bits Daily Auto Publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chess-bits-daily.yml"
      - "scripts/chessbits_daily.py"
      - "cloud-worker/app.py"
  schedule:
    # Primary publication attempt at 5:00 PM IST.
    - cron: "30 11 * * *"
    # Free automatic recovery attempts if the daily upload has not succeeded.
    - cron: "0 13,15,17,19,21 * * *"
  workflow_dispatch:
    inputs:
      force_short_today:
        description: "Publish an additional puzzle Short for today's India date, even if the daily slot is filled"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chess-bits-daily-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout the single source of truth
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether an upload is due and OAuth is configured
        id: gate
        shell: bash
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # For an extra Short, use the dispatch input or include [publish-short-now] in a workflow-file commit message.
          FORCE_SHORT_TODAY: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-short-now]')) || inputs.force_short_today || false }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, timedelta, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          today = now.date()
          path = Path("state/published.json")
          state = json.loads(path.read_text()) if path.exists() else {"published": []}
          rows = state.get("published", [])
          force_short = os.getenv("FORCE_SHORT_TODAY", "").lower() == "true"
          target = today if force_short or not rows else max(date.fromisoformat(x["target_date"]) for x in rows) + timedelta(days=1)
          # A missed earlier date may recover immediately. A new date's normal slot
          # is not due until 5 PM IST, so overnight retries cannot publish it early.
          due_by_date = target < today or (target == today and (now.hour, now.minute) >= (17, 0))
          needed = force_short or due_by_date
          configured = all(os.getenv(key, "").strip() for key in (
              "YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"
          ))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"needed={'true' if needed else 'false'}\n")
              out.write(f"configured={'true' if configured else 'false'}\n")
              out.write(f"target_date={target.isoformat()}\n")
              out.write(f"force_short_today={'true' if force_short else 'false'}\n")
          print(f"Upload due: {needed}; target date: {target.isoformat()}; India time: {now.strftime('%Y-%m-%d %H:%M')}; force Short: {force_short}; OAuth configured: {configured}")
          PY

      - name: Explain the one-time setup blocker
        if: steps.gate.outputs.needed == 'true' && steps.gate.outputs.configured != 'true'
        run: |
          echo "::error::No rendering or upload attempted because YouTube OAuth secrets are missing."
          echo "Add YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET and YOUTUBE_REFRESH_TOKEN under GitHub Settings > Secrets and variables > Actions."
          exit 1

      - name: Install FFmpeg and free Python dependencies
        if: steps.gate.outputs.needed == 'true' && steps.gate.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r cloud-worker/requirements.txt edge-tts google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Fetch Chess.com Neo piece assets
        if: steps.gate.outputs.needed == 'true' && steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python cloud-worker/fetch_assets.py --out-dir cloud-worker/assets && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Validate all curated lines and visual assets
        if: steps.gate.outputs.needed == 'true' && steps.gate.outputs.configured == 'true'
        run: python scripts/chessbits_daily.py --self-test

      - name: Render, quality-check, and upload one public video
        id: publish
        if: steps.gate.outputs.needed == 'true' && steps.gate.outputs.configured == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          CHESSBITS_NOTIFY_EMAIL: ${{ secrets.CHESSBITS_NOTIFY_EMAIL }}
          FORCE_SHORT_TODAY: ${{ steps.gate.outputs.force_short_today }}
        shell: bash
        run: |
          if [ "$FORCE_SHORT_TODAY" = "true" ]; then
            python scripts/chessbits_daily.py --kind puzzle --force-today
          else
            python scripts/chessbits_daily.py
          fi

      - name: Save the publish ledger so retries cannot repeat successful videos
        if: always() && steps.gate.outputs.needed == 'true' && steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/published.json
          if git diff --cached --quiet; then
            echo "No publishing ledger change to save."
          else
            git commit -m "Record Chess Bits daily publishing result"
            git push origin HEAD:main
          fi

      - name: Send failure alert when SMTP is configured
        if: failure() && steps.gate.outputs.needed == 'true' && steps.gate.outputs.configured == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          CHESSBITS_NOTIFY_EMAIL: ${{ secrets.CHESSBITS_NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_DATE: ${{ steps.gate.outputs.target_date }}
        shell: python
        run: |
          import os, smtplib
          from email.message import EmailMessage
          host = os.getenv("SMTP_HOST", "")
          user = os.getenv("SMTP_USERNAME", "")
          password = os.getenv("SMTP_APP_PASSWORD", "")
          recipient = os.getenv("CHESSBITS_NOTIFY_EMAIL", "")
          if not all((host, user, password, recipient)):
              print("SMTP secrets are not configured; the failed run remains visible in GitHub Actions.")
              raise SystemExit(0)
          msg = EmailMessage()
          msg["Subject"] = "Chess Bits automation needs attention"
          msg["From"] = user
          msg["To"] = recipient
          msg.set_content(
              f"The Chess Bits pipeline did not complete for target date {os.getenv('TARGET_DATE', 'unknown')}.\n"
              "The workflow has not marked the upload as successful.\n\n"
              f"Run logs: {os.getenv('RUN_URL', '')}\n"
              "Automatic recovery will retry on the next scheduled attempt."
          )
          port = int(os.getenv("SMTP_PORT") or "465")
          if port == 465:
              with smtplib.SMTP_SSL(host, port, timeout=30) as server:
                  server.login(user, password)
                  server.send_message(msg)
          else:
              with smtplib.SMTP(host, port, timeout=30) as server:
                  server.starttls()
                  server.login(user, password)
                  server.send_message(msg)
